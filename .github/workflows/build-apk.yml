name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm ci

      - name: Préparer l'appli
        run: |
          ./vendor.sh
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Nommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "TachesLabo-v0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TachesLabo-v0.1.${{ github.run_number }}
          path: TachesLabo-*.apk

      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Tâches Labo v0.1.${{ github.run_number }}
          body: |
            Version d'essai. Sur le téléphone : touchez le fichier .apk ci-dessous pour le télécharger,
            puis ouvrez-le et acceptez l'installation (« Autoriser cette source »).
            Les mises à jour s'installent par-dessus sans perdre les données.
          files: TachesLabo-v0.1.${{ github.run_number }}.apk

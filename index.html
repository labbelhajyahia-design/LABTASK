<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tâches Labo</title>
<style>
@font-face{font-family:'Atkinson Hyperlegible';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/atkinson-400.woff2) format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/atkinson-700.woff2) format('woff2')}
/* Layout: one-column phone app — header, scrolling list, fixed bottom nav, floating "+" button, bottom sheets */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#16202A; --muted:#55616C; --line:#DCE2E7; --chip:#E4E9ED;
  --brand:#0B5E84; --brand-ink:#FFFFFF;
  --urgent:#C62828; --due:#B45309; --late:#7F1D1D; --done:#1E7A46; --soon:#1D4ED8;
  --urgent-t:#FDECEC; --due-t:#FDF1E4; --late-t:#F5E6E6; --done-t:#E6F4EC; --soon-t:#E8EEFB;
  --bio-bg:#16202A; --bio-ink:#FFFFFF; --on-strong:#FFFFFF;
  --font:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E141A; --surface:#17202A; --ink:#E7EDF2; --muted:#9BA8B4; --line:#283440; --chip:#222C36;
  --brand:#5AAEDB; --brand-ink:#08202D;
  --urgent:#F27571; --due:#F0A35E; --late:#E59393; --done:#5CC58C; --soon:#86A8F8;
  --urgent-t:#3A1B1D; --due-t:#3A2814; --late-t:#331B1D; --done-t:#14301F; --soon-t:#1B2643;
  --bio-bg:#E7EDF2; --bio-ink:#0E141A; --on-strong:#10161C; color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:170px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top .date{font-size:14px;color:var(--muted)}
.top h1{margin:0;font-size:25px;line-height:1.15;text-wrap:balance}
.iconbtn{width:46px;height:46px;border-radius:23px;border:none;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn.on{background:var(--brand);color:var(--brand-ink)}
.toprow{display:flex;gap:8px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;background:var(--surface);border:2px solid transparent}
.stat b{font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px}
.stat.u{background:var(--urgent);color:var(--on-strong)}.stat.d{background:var(--due);color:var(--on-strong)}.stat.l{border-color:var(--late);color:var(--late)}
.seg{display:flex;gap:4px;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:10px}
.seg button{flex:1;height:40px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700}
.pills{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pill{height:40px;padding:0 16px;border-radius:20px;border:2px solid var(--line);background:var(--surface);font-size:15px}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:16px;padding:12px 12px 12px 14px;display:flex;gap:12px;align-items:center;border:2px solid var(--line);width:100%;text-align:left}
.card.urgent{border-color:var(--urgent)}.card.late{border-color:var(--late)}.card.today{border-color:color-mix(in srgb,var(--due) 45%,var(--line))}.card.paused{opacity:.6}
.ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico.urgent{background:var(--urgent-t);color:var(--urgent)}.ico.late{background:var(--late-t);color:var(--late)}.ico.today{background:var(--due-t);color:var(--due)}.ico.soon{background:var(--soon-t);color:var(--soon)}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tag{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.tag.urgent{color:var(--urgent)}.tag.late{color:var(--late)}.tag.today{color:var(--due)}.tag.soon{color:var(--soon)}.tag.donec{color:var(--done)}
.ttl{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.done-btn{height:46px;padding:0 15px;border-radius:12px;border:none;background:var(--done);color:var(--on-strong);font-weight:700;font-size:15px;flex-shrink:0}
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex-shrink:0;letter-spacing:.2px}
.badge.bio{background:var(--bio-bg)!important;color:var(--bio-ink)}
.empty{background:var(--surface);border-radius:16px;padding:22px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font-size:17px}
.sec{font-size:14px;font-weight:700;color:var(--muted);margin:16px 2px 8px}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
nav.bar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.bar button{height:68px;border:none;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px}
nav.bar button[aria-current="page"]{color:var(--brand);font-weight:700}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(86px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:32px;border:none;background:var(--brand);color:var(--brand-ink);box-shadow:0 8px 22px rgba(11,94,132,.35);display:flex;align-items:center;justify-content:center;z-index:21}
.toasts{position:fixed;left:0;right:0;top:calc(8px + env(safe-area-inset-top,0px));z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.toast{pointer-events:auto;width:100%;max-width:520px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.alarm{background:var(--urgent);color:var(--on-strong)}
.toast .tx{flex:1;min-width:0;font-size:15px}
.toast button{height:38px;padding:0 12px;border-radius:10px;border:2px solid currentColor;background:transparent;font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding-top:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet h2{margin:0 0 12px;font-size:21px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.box{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
label.l,span.l{font-size:14px;color:var(--muted);display:block;margin-bottom:6px}
.in,select.in,textarea.in{width:100%;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:8px 12px;font-size:16px}
textarea.in{min-height:70px;resize:vertical}
.withmic{display:flex;gap:8px}
.withmic .in{flex:1;min-width:0}
.mic{width:50px;height:46px;border-radius:12px;border:none;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:14px;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,var(--surface));font-weight:700}
.chip.u[aria-pressed="true"]{border-color:var(--urgent);background:var(--urgent);color:var(--on-strong)}
.row{display:flex;gap:10px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.dos{display:grid;grid-template-columns:2fr 2fr 3fr;gap:8px}
.dos label{font-size:12px;color:var(--muted);text-align:center;display:block;margin-bottom:4px}
.dos input{width:100%;height:54px;border-radius:12px;border:2px solid var(--line);background:var(--bg);text-align:center;font-size:26px;font-weight:700;letter-spacing:4px;font-variant-numeric:tabular-nums}
.readback{border-radius:12px;padding:10px 12px;font-size:15px}
.readback.ok{background:var(--done-t);color:var(--done)}.readback.bad{background:var(--due-t);color:var(--due)}
.primary{width:100%;height:56px;border-radius:14px;border:none;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:17px}
.primary.go{background:var(--done);color:var(--on-strong)}
.primary:disabled{opacity:.5}
.ghost{min-height:46px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.ghost.blue{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.ghost.danger{border-color:var(--urgent);color:var(--urgent)}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:14px;color:var(--urgent);font-weight:700}
.pin{font-size:28px;letter-spacing:12px;text-align:center;font-variant-numeric:tabular-nums}
.week{background:var(--surface);border-radius:16px;padding:8px 6px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:12px}
.week button{border:none;background:transparent;border-radius:12px;height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink);padding:0}
.week button small{font-size:12px;color:var(--muted)}
.week button strong{font-size:18px}
.week button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.week button[aria-pressed="true"] small{color:inherit}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:3px;display:block}
.wnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;text-align:center}
.slot{display:flex;gap:10px}
.slot .tm{width:50px;text-align:right;font-weight:700;font-size:14px;padding-top:14px;font-variant-numeric:tabular-nums;flex-shrink:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:flex;gap:5px;align-items:center}
.legend i{width:10px;height:10px;border-radius:5px;display:block}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.rows{background:var(--surface);border-radius:16px;overflow:hidden}
.rows .r{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.rows .r:last-child{border-bottom:none}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:44px;height:44px;border-radius:22px;border:3px solid transparent}
.colors button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.notice{background:var(--due-t);color:var(--due);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.notice b{color:var(--ink)}
@media (prefers-reduced-motion: no-preference){.toast{animation:drop .25s ease-out}@keyframes drop{from{transform:translateY(-12px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite">
  <div class="empty"><b>Chargement…</b></div>
</div>
<button class="fab" id="fab" aria-label="Nouvelle tâche" hidden><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="bar" id="nav" hidden><div class="in">
  <button data-act="view" data-v="tasks"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Tâches</button>
  <button data-act="view" data-v="planning"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Planning</button>
  <button data-act="view" data-v="report"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Rapports</button>
  <button data-act="view" data-v="team"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 12 0v1"/><path d="M16 4a4 4 0 0 1 0 8M22 21v-1a6 6 0 0 0-4-5.7"/></svg>Équipe</button>
</div></nav>
<div class="toasts" id="toasts"></div>
<div id="sheet"></div>
<input type="file" id="scanfile" accept="image/*" capture="environment" hidden>
<input type="file" id="restorefile" accept="application/json,.json" hidden>

<script src="vendor/capacitor.js"></script>
<script src="vendor/app.js"></script>
<script src="vendor/local-notifications.js"></script>
<script src="vendor/filesystem.js"></script>
<script src="vendor/share.js"></script>
<script src="vendor/speech-recognition.js"></script>
<script src="vendor/zxing.min.js"></script>
<script src="app.js"></script>
</body>
</html>
